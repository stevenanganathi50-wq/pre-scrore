# pre-scrore hosting config.
#
# No build step: web/ is plain HTML/CSS/JS with no framework, and data.json is
# regenerated by the GitHub Actions cycle (.github/workflows/cycle.yml), not
# by Netlify. Deploys here just serve whatever is committed in web/.

[build]
  publish = "web"
  command = ""

[[headers]]
  for = "/data.json"
  [headers.values]
    # The cycle runs every 6 hours; a long cache would show a stale record
    # for part of that window. Let it revalidate instead of going stale.
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

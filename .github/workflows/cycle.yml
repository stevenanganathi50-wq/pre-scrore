# pre-scrore scheduled cycle.
# ingest -> pull -> run (fixtures, publish, grade, export) -> push -> deploy
#
# Deploys to Netlify (the actual live host, pre-scrore.netlify.app), not
# GitHub Pages -- Pages was never enabled for this repo, since Netlify was
# chosen instead. An earlier version of this workflow tried to deploy to
# Pages anyway and failed every run with a 404; this replaced it.
#
# `pull` is not optional. A runner starts with no database, so without it
# `publish` would re-predict fixtures that are already public and `grade`
# would score those local rows rather than the ones actually published,
# attaching metrics to remote predictions whose probabilities nobody saw.
#
# A prediction cannot be written after kickoff, by design. A missed run is
# therefore a permanent hole in the record, not a delay -- which is why this
# runs six times a day against a seven-day publish horizon, giving each
# fixture roughly 28 chances to be caught.

name: cycle

on:
  schedule:
    # Every 6 hours (UTC). GitHub queues scheduled jobs and can run them late
    # under load; the wide horizon absorbs that.
    - cron: "0 */6 * * *"
  workflow_dispatch:

# Never let two cycles overlap. They would both try to publish the same
# fixtures, and the remote unique constraint would turn that into a failure
# rather than a no-op.
concurrency:
  group: prescore-cycle
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cycle:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Not secret -- it's a site identifier, not a credential. It already
      # appears in this project's own deploy logs and README.
      NETLIFY_SITE_ID: 8f6968e1-4f4d-4561-927c-7cca99528d15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The project has no dependencies, so there is nothing to install.
      # Only the downloaded season CSVs are worth keeping between runs.
      - name: Cache football-data CSVs
        uses: actions/cache@v4
        with:
          path: data/raw
          key: football-data-${{ github.run_id }}
          restore-keys: football-data-

      # Fail here with a clear message rather than three steps later with a
      # confusing HTTP 401. `env` prints key lengths, never key values.
      - name: Check credentials are present
        run: |
          python -m prescore env
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY is not set. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Seed historical results
        run: python -m prescore ingest

      - name: Pull the published record from Supabase
        run: python -m prescore pull

      - name: Sync fixtures, publish, grade, export
        run: python -m prescore run --horizon-days 7

      - name: Push to Supabase
        run: python -m prescore push

      - name: Show the record
        run: python -m prescore status

      # ubuntu-latest ships Node.js, so this needs no extra setup step.
      # Pinned to the major version already verified locally (netlify-cli
      # 27.0.1), matching how the actions/* steps above are pinned.
      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error::NETLIFY_AUTH_TOKEN is not set. Add it under Settings -> Secrets and variables -> Actions (create it at app.netlify.com -> User settings -> Applications -> New access token)."
            exit 1
          fi
          npx --yes netlify-cli@27 deploy --prod --dir=web --site="$NETLIFY_SITE_ID"

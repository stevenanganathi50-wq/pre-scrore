# Tests run on their own, deliberately separate from the cycle.
#
# If a test regression blocked the cycle, a broken build would turn into
# missing predictions -- and a missing prediction is permanent, because it
# cannot be written after kickoff. Better to know the tests are red while the
# record keeps being published, than to silently stop publishing.

name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No dependencies by design: the whole pipeline is standard library.
      - name: Confirm the project has no third-party imports
        run: |
          if [ -f requirements.txt ] || [ -f pyproject.toml ]; then
            echo "::warning::dependency manifest added -- update this workflow"
          fi

      - name: Run tests
        run: python -m unittest discover -s tests -t . -v
